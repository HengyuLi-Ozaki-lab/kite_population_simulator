# Pass criteria for the decision-value analysis on the SocSci210 test split.
# Written after calibrating on the development split and before the analysis was run on test.
# scripts/a1_decision_value.py refuses the test split while this file is absent, and echoes it into its output.
frozen_at_commit: 5044404
frozen_on: 2026-09-21

population:
  tasks: one and the same stated scale across at least two conditions
  reliable_contrast: "|z| >= 3, z from respondent-clustered standard errors of whichever data does the judging"
  simulated_respondents_per_cell: all that the test run holds (200)
procedure: {rng_seed: 0, permutations: 2000, study_bootstrap: 2000, half_sample_splits: 200}

criteria:
  pass:  # usable for screening: the simulation knows which way conditions move people, and choosing by it pays
    sign_accuracy: "permutation p < 0.01 and observed above the null's 95th percentile"
    captured_gain: "permutation p < 0.01 and the study-bootstrap 95% interval excludes 0"
  strong:  # on top of pass, under the same judging half as a human pilot run on half the respondents
    sign_accuracy: "(simulation - 0.5) / (pilot - 0.5) >= 2/3"
    captured_gain: "simulation / pilot >= 2/3"
reported_without_a_threshold: [effect-size curve, reliability curve, stability against simulated respondents and its cost]

calibration_on_dev:  # 20 studies, 146 tasks, 57 reliable contrasts, 50 simulated respondents per cell
  sign_accuracy: {observed: 0.825, null_p95: 0.632, pilot: 0.953, simulation_same_judge: 0.904}
  captured_gain: {observed: 0.610, null_p95: 0.179, pilot: 0.549, simulation_same_judge: 0.531}

disclosures:
  - The test predictions were produced for G1/G1b and have been scored once for those gates. This is a secondary analysis of them, specified on dev.
  - "The test-split condition sensitivity (r = 0.385, against 0.640 on dev) was already known when these criteria were written, so a drop from the dev figures is expected. The pass tier rests on permutation tests, which that knowledge cannot help; the strong tier's 2/3 was set knowing a drop was likely, and is meant to be demanding."
  - The development split chose the phrasing, partly on condition sensitivity, so the dev figures above are optimistic.
