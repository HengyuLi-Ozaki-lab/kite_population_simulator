[project]
name = "kite"
version = "0.1.0"
description = "Social Wind Tunnel: calibrated decision models as behavioral kernels for population simulation"
requires-python = ">=3.12"
dependencies = [
    "typesafe-sdk>=0.7.0",
    "system-one-adapter[openai,anthropic]>=0.2.0",
    "pydantic>=2.12",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "matplotlib>=3.9",
    "huggingface_hub>=0.24",
]

[project.scripts]
kite = "kite.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["live: needs network access and API keys; skipped unless the key is set"]

[tool.ruff]
line-length = 150
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/kite/cli.py" = ["B008"]  # typer declares options as argument defaults
